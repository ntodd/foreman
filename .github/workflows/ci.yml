name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for advisories published against a lock nobody has touched.
  schedule:
    - cron: "23 6 * * 1"
  # The release workflow runs it on the tag before building anything.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.1"

jobs:
  protocol:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/foreman_protocol
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/foreman_protocol/deps
            apps/foreman_protocol/_build
          key: protocol-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/foreman_protocol/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  agent:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/foreman_agent
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/foreman_agent/deps
            apps/foreman_agent/_build
          key: agent-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/foreman_agent/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  # The agent against a real Docker daemon and the real devcontainer CLI.
  agent-docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/foreman_agent
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/foreman_agent/deps
            apps/foreman_agent/_build
          key: agent-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/foreman_agent/mix.lock') }}
      - name: Install the devcontainer CLI
        run: npm install --prefix "$RUNNER_TEMP/devcontainer" --no-fund --no-audit @devcontainers/cli@0.89.0
      - run: mix deps.get
      - run: mix test --only docker
        env:
          FOREMAN_DEVCONTAINER_CLI: ${{ runner.temp }}/devcontainer/node_modules/.bin/devcontainer

  control-plane:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    defaults:
      run:
        working-directory: apps/foreman
    env:
      MIX_ENV: test
      FOREMAN_DB: ${{ matrix.db }}
      DATABASE_URL: ecto://postgres:postgres@localhost/foreman_test
    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/foreman/deps
            apps/foreman/_build
          key: cp-${{ matrix.db }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/foreman/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix sobelow --config --exit
      - run: mix test

  feature:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: ShellCheck
        run: shellcheck -s sh features/src/foreman/install.sh features/src/foreman/scripts/* docker/box-entrypoint.sh apps/foreman/priv/agent/install.sh scripts/publish-agent-release.sh
      - name: Test the feature in a real devcontainer
        run: npx --yes @devcontainers/cli@0.89.0 features test --features foreman --base-image mcr.microsoft.com/devcontainers/base:debian --skip-scenarios features

  # The personal control plane installer, against stubbed docker and
  # tailscale (test/installer). test/installer/e2e runs it for real, but
  # needs network and a local image, so it stays out of CI.
  installer:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: |
          shellcheck scripts/install-control-plane.sh test/installer/e2e/fake-tailscale
          shellcheck -s sh scripts/render-control-plane-installer.sh scripts/release-is-latest.sh test/installer/e2e/run.sh
      - name: Install bats
        # jq is on the runner image already; the installer needs it, so say so.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats jq
      - name: Test the installer
        run: bats test/installer

  images:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foreman
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the control plane image
        run: docker build -f docker/control-plane.Dockerfile -t foreman .
      - name: Build the control plane image for Postgres
        run: docker build -f docker/control-plane.Dockerfile --build-arg FOREMAN_DB=postgres -t foreman:pg .
      # Both images, started with only what docs/setup says to set, have to
      # migrate and answer /healthz (which checks the database).
      - name: Boot both control plane images
        run: |
          run() {
            name=$1 port=$2 image=$3
            shift 3
            docker run -d --name "$name" --network host \
              -e SECRET_KEY_BASE="$(openssl rand -base64 48)" \
              -e FOREMAN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
              -e PHX_HOST=localhost -e PORT="$port" "$@" "$image"
          }
          run cp-sqlite 4001 foreman
          run cp-pg 4002 foreman:pg \
            -e DATABASE_URL=ecto://postgres:postgres@localhost:5432/foreman -e DATABASE_SSL=false

          for port in 4001 4002; do
            for _ in $(seq 60); do
              curl -fsS "http://localhost:$port/healthz" && echo " :$port" && continue 2
              sleep 1
            done
            docker logs cp-sqlite; docker logs cp-pg
            exit 1
          done
      - name: The SQLite image refuses a DATABASE_URL
        run: |
          status=0
          timeout 60 docker run --rm \
            -e SECRET_KEY_BASE="$(openssl rand -base64 48)" \
            -e FOREMAN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e PHX_HOST=localhost -e DATABASE_URL=ecto://postgres:postgres@localhost/foreman \
            foreman > refused.log 2>&1 || status=$?
          cat refused.log
          [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && grep -q "built for SQLite" refused.log
      - name: Build the box image
        run: docker build -f docker/box.Dockerfile --target box -t foreman-box .

  security:
    runs-on: ubuntu-24.04
    # gitleaks lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Audit Hex advisories and retirements
        if: ${{ !cancelled() }}
        run: |
          for app in foreman foreman_agent foreman_protocol; do
            (cd "apps/$app" && mix deps.get >/dev/null && mix hex.audit) || exit 1
          done
      - name: Audit the control plane's dependencies (mix_audit)
        if: ${{ !cancelled() }}
        working-directory: apps/foreman
        run: MIX_ENV=test mix deps.audit
      - name: Scan for secrets
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml uses [[allowlists]], which needs 8.25 or newer.
          GITLEAKS_VERSION: 8.30.1
