name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for advisories published against a lock nobody has touched.
  schedule:
    - cron: "23 6 * * 1"
  # The release workflow runs it on the tag before building anything.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.1"

# Every job runs on the self-hosted runners, which share one host and one
# Docker daemon: nothing may publish a fixed port or use a fixed container
# or image name. Postgres is reached at its container's own address.

jobs:
  protocol:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/foreman_protocol
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/foreman_protocol/deps
            apps/foreman_protocol/_build
          key: protocol-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/foreman_protocol/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  agent:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/foreman_agent
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/foreman_agent/deps
            apps/foreman_agent/_build
          key: agent-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/foreman_agent/mix.lock') }}
      # The agent reads compose files with Node (ComposeScan).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  # The agent against a real Docker daemon and the real devcontainer CLI.
  agent-docker:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/foreman_agent
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/foreman_agent/deps
            apps/foreman_agent/_build
          key: agent-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/foreman_agent/mix.lock') }}
      - name: Install the devcontainer CLI the agent release carries
        run: |
          mkdir -p "$RUNNER_TEMP/devcontainer"
          cp rel/tools/devcontainer/package.json rel/tools/devcontainer/package-lock.json "$RUNNER_TEMP/devcontainer/"
          npm ci --prefix "$RUNNER_TEMP/devcontainer" --omit=dev --ignore-scripts --no-fund --no-audit
      - run: mix deps.get
      - run: mix test --only docker
        env:
          FOREMAN_DEVCONTAINER_CLI: ${{ runner.temp }}/devcontainer/node_modules/.bin/devcontainer

  control-plane:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    defaults:
      run:
        working-directory: apps/foreman
    env:
      MIX_ENV: test
      FOREMAN_DB: ${{ matrix.db }}
    services:
      postgres:
        # The official image from its ECR Public mirror, since Docker Hub
        # rate-limits anonymous pulls.
        image: ${{ matrix.db == 'postgres' && 'public.ecr.aws/docker/library/postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/foreman/deps
            apps/foreman/_build
          key: cp-${{ matrix.db }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/foreman/mix.lock') }}
      - name: Point the tests at Postgres
        if: matrix.db == 'postgres'
        run: >-
          echo "DATABASE_URL=ecto://postgres:postgres@$(docker inspect -f
          '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'
          ${{ job.services.postgres.id }})/foreman_test" >> "$GITHUB_ENV"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix sobelow --config --exit
      - run: mix test
      # What Flatcar's Ignition (the version Flatcar ships) makes of the
      # first-boot configs the control plane makes for Flatcar boxes.
      - name: Validate Flatcar first-boot configs
        if: matrix.db == 'sqlite'
        run: |
          for arch in amd64 arm64; do
            mix run --no-start -e "{:ok, c} = Foreman.Boxes.Flatcar.ignition(%{url: \"https://foreman.example.ts.net\", join_token: \"fj_ci\", name: \"ci\", arch: \"$arch\", tailscale_auth_key: \"tskey-auth-ci\", ssh_keys: [\"ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA ci\"]}); File.write!(\"$RUNNER_TEMP/$arch.ign\", JSON.encode!(c))"
            docker run --rm -i quay.io/coreos/ignition-validate:v2.24.0@sha256:b951f790f0ec6ae3a440ba67f2121e4ed19017d3f5024e45dd5c5916602687b2 - < "$RUNNER_TEMP/$arch.ign"
          done

  feature:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: ShellCheck
        run: shellcheck -s sh features/src/foreman/install.sh features/src/foreman/scripts/* apps/foreman/priv/agent/install.sh apps/foreman/priv/agent/mac.sh apps/foreman/priv/agent/vm.sh apps/foreman/priv/flatcar/*.sh apps/foreman_agent/rel/tools/bundle.sh apps/foreman_agent/rel/tools/devcontainer.sh scripts/publish-agent-release.sh e2e/*.sh e2e/firewall/test.sh e2e/linux/run.sh e2e/flatcar/run.sh e2e/linux/bin/gh docker/foreman-update e2e/updater/run.sh
      - name: Test the feature in a real devcontainer
        run: npx --yes @devcontainers/cli@0.89.0 features test --features foreman --base-image mcr.microsoft.com/devcontainers/base:debian --skip-scenarios features

  # The box firewall against a fake tailnet: a peer behind an interface
  # named tailscale0, as a box on the tailnet has. The test changes its
  # host's network, so it runs in a privileged Docker-in-Docker container
  # of its own, with its own network namespace, nftables and Docker.
  firewall:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64]
    env:
      RUN: foreman-ci-firewall-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the rules
        run: |
          trap 'docker rm -f "$RUN" >/dev/null 2>&1' EXIT
          docker run -d --privileged --name "$RUN" public.ecr.aws/docker/library/docker:29-dind >/dev/null
          docker cp e2e/firewall/test.sh "$RUN":/test.sh
          docker cp apps/foreman_agent/priv/firewall/foreman.nft "$RUN":/foreman.nft
          docker exec "$RUN" sh -c 'for _ in $(seq 60); do docker info >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
          docker exec "$RUN" apk add -q nftables iproute2
          docker exec -e FWTEST_IMAGE=public.ecr.aws/docker/library/busybox:1.37-musl "$RUN" sh /test.sh /foreman.nft

  images:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64]
    env:
      RUN: foreman-ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foreman
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the control plane image
        run: docker build -f docker/control-plane.Dockerfile -t "$RUN" .
      - name: Build the control plane image for Postgres
        run: docker build -f docker/control-plane.Dockerfile --build-arg FOREMAN_DB=postgres -t "$RUN-pg" .
      # Both images, started with only what docs/setup says to set (host
      # networking included), have to migrate and answer /healthz (which
      # checks the database).
      - name: Boot both control plane images
        env:
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          free_port() {
            while :; do
              port=$(shuf -i 20000-60999 -n 1)
              ss -Htln "sport = :$port" | grep -q . || { echo "$port"; return; }
            done
          }
          run() {
            name=$1 port=$2 image=$3
            shift 3
            docker run -d --name "$name" --network host \
              -e SECRET_KEY_BASE="$(openssl rand -base64 48)" \
              -e FOREMAN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
              -e PHX_HOST=localhost -e PORT="$port" "$@" "$image"
          }
          db=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES")
          sqlite_port=$(free_port)
          pg_port=$(free_port)
          run "$RUN-sqlite" "$sqlite_port" "$RUN"
          run "$RUN-pg" "$pg_port" "$RUN-pg" \
            -e DATABASE_URL="ecto://postgres:postgres@$db:5432/foreman" -e DATABASE_SSL=false

          for port in "$sqlite_port" "$pg_port"; do
            for _ in $(seq 60); do
              curl -fsS "http://localhost:$port/healthz" && echo " :$port" && continue 2
              sleep 1
            done
            docker logs "$RUN-sqlite"; docker logs "$RUN-pg"
            exit 1
          done
      - name: The SQLite image refuses a DATABASE_URL
        run: |
          status=0
          timeout 60 docker run --rm --name "$RUN-refused" \
            -e SECRET_KEY_BASE="$(openssl rand -base64 48)" \
            -e FOREMAN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e PHX_HOST=localhost -e DATABASE_URL=ecto://postgres:postgres@localhost/foreman \
            "$RUN" > refused.log 2>&1 || status=$?
          cat refused.log
          [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && grep -q "built for SQLite" refused.log
      # A hosted VM would be thrown away; this daemon is shared and kept.
      - name: Remove the containers and images
        if: always()
        run: |
          docker rm -f "$RUN-sqlite" "$RUN-pg" "$RUN-refused" 2>/dev/null || true
          docker image rm -f "$RUN" "$RUN-pg" 2>/dev/null || true

  # The agent release bundles ERTS, linked against its build image's glibc
  # and OpenSSL; it has to start on the oldest systems boxes run.
  agent-smoke:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the agent release
        run: docker build -f docker/box.Dockerfile --target agent-tarball -o "$RUNNER_TEMP/agent" .
      - name: Start it on Ubuntu 22.04 and 24.04, and Debian 12 and 13
        run: e2e/agent-smoke.sh "$RUNNER_TEMP/agent/foreman_agent.tar.gz"

  # A control plane, and a box that boots systemd and installs the agent
  # with the served install script: enrollment, a re-run, an environment,
  # secrets, a reboot, a self-update, --reenroll and a rollback.
  e2e-linux:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    env:
      E2E_PROJECT: foreman-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # For mix foreman_agent.sign, which makes the release keys and signs
      # the agents the run publishes.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/foreman_agent/deps
            apps/foreman_agent/_build
          key: agent-dev-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/foreman_agent/mix.lock') }}
      - name: Compile the agent
        working-directory: apps/foreman_agent
        run: mix deps.get && mix compile
      - run: e2e/linux/run.sh
      - name: Logs
        if: failure()
        run: e2e/linux/run.sh --logs
      - name: Remove the stack and its images
        if: always()
        run: |
          e2e/linux/run.sh --down || true
          docker image rm -f "$E2E_PROJECT-cp" "$E2E_PROJECT-box" 2>/dev/null || true

  # A control plane host that boots systemd, runs the control plane from
  # docker/compose.yml and installs the updater: refused requests, an
  # update, and a rollback that restores the data volume.
  e2e-updater:
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    env:
      E2E_PROJECT: foreman-update-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: e2e/updater/run.sh
      - name: Logs
        if: failure()
        run: e2e/updater/run.sh --logs
      - name: Remove the host and its images
        if: always()
        run: |
          e2e/updater/run.sh --down || true
          docker image rm -f "$E2E_PROJECT-cp:0.9.1" "$E2E_PROJECT-cp:0.9.2" "$E2E_PROJECT-cp:0.9.3" "$E2E_PROJECT-box" 2>/dev/null || true

  security:
    runs-on: [self-hosted, Linux, X64]
    # gitleaks lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Audit Hex advisories and retirements
        if: ${{ !cancelled() }}
        run: |
          for app in foreman foreman_agent foreman_protocol; do
            (cd "apps/$app" && mix deps.get >/dev/null && mix hex.audit) || exit 1
          done
      - name: Audit the control plane's dependencies (mix_audit)
        if: ${{ !cancelled() }}
        working-directory: apps/foreman
        run: MIX_ENV=test mix deps.audit
      # gitleaks-action downloads to a fixed $TMPDIR/gitleaks.tmp and fails
      # if it already exists. TMPDIR on the self-hosted runners is shared,
      # so give the scan a directory of its own.
      - name: Make a temp directory for gitleaks
        if: ${{ !cancelled() }}
        run: |
          dir="$RUNNER_TEMP/gitleaks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dir"
          echo "GITLEAKS_TMPDIR=$dir" >> "$GITHUB_ENV"
      - name: Scan for secrets
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          TMPDIR: ${{ env.GITLEAKS_TMPDIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml uses [[allowlists]], which needs 8.25 or newer.
          GITLEAKS_VERSION: 8.30.1
          # The upload wants the workspace under $HOME, which it isn't on
          # the self-hosted runners; findings are in the log anyway.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Remove the gitleaks temp directory
        if: ${{ always() }}
        run: |
          if [ -n "${GITLEAKS_TMPDIR:-}" ]; then rm -rf "$GITLEAKS_TMPDIR"; fi
