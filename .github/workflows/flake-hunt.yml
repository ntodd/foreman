name: Flake hunt

# Runs each app's suite 100 times a night, with random seeds, and opens
# an issue for every test that fails some runs and passes the rest. See
# https://github.com/ntodd/github-actions/tree/main/flake-hunt.
#
# A pull request that changes this file gets a short dry run: 4 runs per
# app, with what it would file in the job summary.
#
# With a CLAUDE_CODE_OAUTH_TOKEN secret (claude setup-token), each new
# flake's issue also gets Claude's diagnosis.
#
# Each new or reopened flake also starts agent-ready on its issue, which
# opens a PR with the fix.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/flake-hunt.yml]

concurrency:
  group: flake-hunt-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  protocol:
    uses: ntodd/github-actions/.github/workflows/flake-hunt.yml@main
    permissions:
      contents: read
      issues: write
      actions: write
    with:
      agent-workflow: agent-ready.yml
      working-directory: apps/foreman_protocol
      shards: ${{ github.event_name == 'pull_request' && 2 || 4 }}
      runs-per-shard: ${{ github.event_name == 'pull_request' && 2 || 25 }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  agent:
    uses: ntodd/github-actions/.github/workflows/flake-hunt.yml@main
    permissions:
      contents: read
      issues: write
      actions: write
    with:
      agent-workflow: agent-ready.yml
      working-directory: apps/foreman_agent
      shards: ${{ github.event_name == 'pull_request' && 2 || 4 }}
      runs-per-shard: ${{ github.event_name == 'pull_request' && 2 || 25 }}
      # ComposeScan reads compose files with Node.
      node-version: "22"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  control-plane:
    uses: ntodd/github-actions/.github/workflows/flake-hunt.yml@main
    permissions:
      contents: read
      issues: write
      actions: write
    with:
      agent-workflow: agent-ready.yml
      working-directory: apps/foreman
      shards: ${{ github.event_name == 'pull_request' && 2 || 4 }}
      runs-per-shard: ${{ github.event_name == 'pull_request' && 2 || 25 }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
