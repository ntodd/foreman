name: Release

# Pushing a tag like v0.3.0 builds the guest image and the agent for each
# target while it checks that CI passed on the commit. Once it has, it
# signs the agents, builds the control plane images with them inside and
# pushes them to GHCR, and attaches the agents to a GitHub release:
#
#   ghcr.io/<owner>/foreman:0.3.0      and :latest      (SQLite)
#   ghcr.io/<owner>/foreman:0.3.0-pg   and :latest-pg   (Postgres)
#
# A control plane registers the agents its image carries at boot, so
# upgrading it is a pull and a restart. scripts/publish-agent-release.sh
# still registers a GitHub release's agents by hand.
#
# Needs the FOREMAN_RELEASE_PRIVATE_KEY secret and the
# FOREMAN_RELEASE_PUBLIC_KEY variable (`mix foreman_agent.sign --keygen`).

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check the tag and keys
        id: check
        env:
          PUBLIC_KEY: ${{ vars.FOREMAN_RELEASE_PUBLIC_KEY }}
          HAS_PRIVATE_KEY: ${{ secrets.FOREMAN_RELEASE_PRIVATE_KEY != '' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || { echo "::error::$GITHUB_REF_NAME isn't vX.Y.Z"; exit 1; }
          [ -n "$PUBLIC_KEY" ] || { echo "::error::Set the FOREMAN_RELEASE_PUBLIC_KEY variable"; exit 1; }
          [ "$HAS_PRIVATE_KEY" = true ] || { echo "::error::Set the FOREMAN_RELEASE_PRIVATE_KEY secret"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A tag usually goes on a commit just merged to main, and that push runs
  # CI. Wait for that run and take its result instead of running every job
  # again. Without one that passes, CI runs here (below).
  wait:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      ci: ${{ steps.ci.outputs.ci }}
    steps:
      - name: Find CI on this commit
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" \
            --jq '.workflow_runs[0].id // empty') || run=""
          if [ -n "$run" ]; then
            echo "Waiting for CI on main: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
          fi
          if [ -n "$run" ] && gh run watch "$run" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 >/dev/null; then
            echo "CI passed on $GITHUB_SHA."
            echo "ci=passed" >> "$GITHUB_OUTPUT"
          else
            echo "No passing CI on main for $GITHUB_SHA; running it here."
            echo "ci=run" >> "$GITHUB_OUTPUT"
          fi

  # CI doesn't run on tags by itself, and nothing is signed or published
  # from a commit that fails it (see sign).
  ci:
    needs: wait
    if: needs.wait.outputs.ci == 'run'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  # The guest system image every environment VM boots (amd64 only for now).
  # The amd64 agent is built with its URL on this release and its SHA-256,
  # and downloads and checks it itself.
  #
  # This and the agent build don't wait for CI: they publish nothing, and
  # they're done by the time it passes.
  guest:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the guest image
        id: build
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          guest/build.sh out
          mv out/foreman-guest-linux-amd64.tar "out/foreman-guest-$VERSION-linux-amd64.tar"
          echo "sha256=$(sha256sum "out/foreman-guest-$VERSION-linux-amd64.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest
          path: out/foreman-guest-*.tar
          if-no-files-found: error

  cli:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Package and run the CLI on its target
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          scripts/package-cli.sh "$GITHUB_REF_NAME" "$TARGET_OS" "$TARGET_ARCH" out
          scripts/smoke-cli.sh "$GITHUB_REF_NAME" "out/foreman-cli-$GITHUB_REF_NAME-$TARGET_OS-$TARGET_ARCH.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: out/foreman-cli-*.tar.gz
          if-no-files-found: error

  agent:
    needs: [check, guest]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the agent
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PUBLIC_KEY: ${{ vars.FOREMAN_RELEASE_PUBLIC_KEY }}
          ARCH: ${{ matrix.arch }}
          GUEST_SHA256: ${{ needs.guest.outputs.sha256 }}
        run: |
          guest_url="" guest_sha256=""
          if [ "$ARCH" = amd64 ]; then
            guest_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/foreman-guest-$VERSION-linux-amd64.tar"
            guest_sha256=$GUEST_SHA256
          fi
          docker build -f docker/box.Dockerfile --target agent-tarball \
            --build-arg FOREMAN_AGENT_VERSION="$VERSION" \
            --build-arg FOREMAN_RELEASE_PUBLIC_KEY="$PUBLIC_KEY" \
            --build-arg FOREMAN_GUEST_URL="$guest_url" \
            --build-arg FOREMAN_GUEST_SHA256="$guest_sha256" \
            -o out .
          mv out/foreman_agent.tar.gz "out/foreman_agent-$VERSION-linux-$ARCH.tar.gz"
      # On this runner's architecture, before anything is signed or published.
      - name: Start it on Ubuntu 22.04 and 24.04, and Debian 12 and 13
        env:
          VERSION: ${{ needs.check.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: e2e/agent-smoke.sh "out/foreman_agent-$VERSION-linux-$ARCH.tar.gz"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.arch == 'amd64'
        with:
          name: guest
          path: guest-artifact
      - name: Give the runner's user KVM
        if: matrix.arch == 'amd64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot the release guest with the release agent
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GUEST_SHA256: ${{ needs.guest.outputs.sha256 }}
        run: |
          guest="guest-artifact/foreman-guest-$VERSION-linux-amd64.tar"
          echo "$GUEST_SHA256  $guest" | sha256sum -c -
          e2e/guest/run.sh "guest-artifact/foreman-guest-$VERSION-linux-amd64.tar" "out/foreman_agent-$VERSION-linux-amd64.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-${{ matrix.arch }}
          path: out/*.tar.gz
          if-no-files-found: error

  # The release key is first used here, so this is where the builds wait
  # for CI: on main (wait), or run here (ci).
  #
  # A skipped CI job is expected only when wait observed a successful run
  # on this commit. Check gate results explicitly, including timeouts.
  sign:
    needs: [check, wait, ci, agent, cli]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' && needs.wait.result == 'success' &&
          needs.agent.result == 'success' && needs.cli.result == 'success' &&
          ((needs.wait.outputs.ci == 'passed' && needs.ci.result == 'skipped') ||
           (needs.wait.outputs.ci == 'run' && needs.ci.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-*
          path: out
          merge-multiple: true
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Sign
        working-directory: apps/foreman_agent
        # bash, not the default shell, so a failed sign isn't hidden by the pipe.
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          FOREMAN_RELEASE_PRIVATE_KEY: ${{ secrets.FOREMAN_RELEASE_PRIVATE_KEY }}
        run: |
          mix deps.get
          # Compile first so the task's output is only the signature.
          mix compile
          for arch in amd64 arm64; do
            tarball="../../out/foreman_agent-$VERSION-linux-$arch.tar.gz"
            mix foreman_agent.sign "$VERSION" "linux-$arch" "$tarball" | tail -n 1 > "$tarball.sig"
            [ -s "$tarball.sig" ]
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agents
          path: out/
          if-no-files-found: error

  # One image per database and architecture, each built on a native
  # runner; the manifest job combines them into multi-arch tags.
  image:
    needs: [check, sign]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.sign.result == 'success' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        db: [sqlite, postgres]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agents
          path: docker/agents
      - name: Build and push
        env:
          VERSION: ${{ needs.check.outputs.version }}
          DB: ${{ matrix.db }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          suffix=""
          [ "$DB" = postgres ] && suffix=-pg
          tag="$image:$VERSION$suffix-$ARCH"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f docker/control-plane.Dockerfile \
            --build-arg FOREMAN_DB="$DB" \
            --build-arg FOREMAN_VERSION="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$tag" .
          docker push "$tag"

  manifest:
    needs: [check, image]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Tag the multi-arch images
        # bash, not the default shell, so a failed gh api isn't hidden by the pipe.
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # :latest only moves to the highest version, so a patch tagged on
          # an older line doesn't take it back.
          highest=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate \
            --jq '.[].ref | ltrimstr("refs/tags/")' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          [ -n "$highest" ] || { echo "::error::couldn't list the release tags"; exit 1; }
          for suffix in "" -pg; do
            set -- -t "$image:$VERSION$suffix"
            [ "$highest" = "$GITHUB_REF_NAME" ] && set -- "$@" -t "$image:latest$suffix"
            docker buildx imagetools create "$@" \
              "$image:$VERSION$suffix-amd64" "$image:$VERSION$suffix-arm64"
          done

  release:
    needs: [check, manifest]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.manifest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The previous tag, to say what changed since it.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agents
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: out
          merge-multiple: true
      - name: Verify the complete CLI release and write its manifest
        run: scripts/checksum-cli.sh "$GITHUB_REF_NAME" out
      - name: Test release publication and replay against local fixtures
        run: python3 -B scripts/test_publish_release.py
      - name: Publish the GitHub release
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          protocol_of() { git show "$1:apps/foreman_protocol/lib/foreman_protocol.ex" | sed -n 's/^  @version \([0-9]*\)$/\1/p'; }
          prev=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V |
            awk -v tag="$GITHUB_REF_NAME" '$0 == tag { print last; exit } { last = $0 }')
          protocol=$(protocol_of "$GITHUB_REF_NAME")

          # What docs/setup/upgrading.md tells operators to check before
          # upgrading or rolling back.
          {
            echo "Control plane images, with this release's agents inside: \`$image:$VERSION\` (SQLite) and \`$image:$VERSION-pg\` (Postgres)."
            echo
            if [ -z "$prev" ]; then
              echo "Protocol $protocol."
            elif [ "$(protocol_of "$prev")" = "$protocol" ]; then
              echo "Protocol $protocol, the same as $prev."
            else
              echo "**Protocol $protocol; $prev spoke $(protocol_of "$prev").** Once boxes run these agents, the control plane can't be rolled back to a release older than this one."
            fi
            echo
            migrations=""
            if [ -n "$prev" ]; then
              migrations=$(git diff --name-only --diff-filter=A "$prev" "$GITHUB_REF_NAME" -- apps/foreman/priv/repo/migrations | xargs -r -n 1 basename)
            fi
            if [ -n "$migrations" ]; then
              echo "Migrations since $prev (they run on boot; back up first):"
              for migration in $migrations; do echo "- $migration"; done
            elif [ -n "$prev" ]; then
              echo "No migrations since $prev."
            fi
            echo
            echo "To register these agents on a control plane by hand: \`scripts/publish-agent-release.sh $VERSION\`"
          } > notes.md
          python3 scripts/publish_release.py "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" notes.md out
