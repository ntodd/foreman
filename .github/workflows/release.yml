name: Agent release

# Pushing a tag like v0.2.0 builds the agent for each target, signs the
# tarballs and attaches them to a GitHub release. The control plane
# doesn't fetch from GitHub; scripts/publish-agent-release.sh downloads a
# release and registers it there.
#
# Needs the FOREMAN_RELEASE_PRIVATE_KEY secret and the
# FOREMAN_RELEASE_PUBLIC_KEY variable (`mix foreman_agent.sign --keygen`).

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.1"

jobs:
  agent:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag and keys
        env:
          PUBLIC_KEY: ${{ vars.FOREMAN_RELEASE_PUBLIC_KEY }}
          HAS_PRIVATE_KEY: ${{ secrets.FOREMAN_RELEASE_PRIVATE_KEY != '' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::$GITHUB_REF_NAME isn't vX.Y.Z"; exit 1; }
          [ -n "$PUBLIC_KEY" ] || { echo "::error::Set the FOREMAN_RELEASE_PUBLIC_KEY variable"; exit 1; }
          [ "$HAS_PRIVATE_KEY" = true ] || { echo "::error::Set the FOREMAN_RELEASE_PRIVATE_KEY secret"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # arm64 builds under QEMU; slow, but it needs no arm64 runner.
      - name: Set up QEMU
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2 --install arm64

      - name: Build the agent
        env:
          PUBLIC_KEY: ${{ vars.FOREMAN_RELEASE_PUBLIC_KEY }}
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            docker buildx build -f docker/box.Dockerfile --target agent-tarball \
              --platform "linux/$arch" \
              --build-arg FOREMAN_AGENT_VERSION="$VERSION" \
              --build-arg FOREMAN_RELEASE_PUBLIC_KEY="$PUBLIC_KEY" \
              -o "out/$arch" .
            mv "out/$arch/foreman_agent.tar.gz" "out/foreman_agent-$VERSION-linux-$arch.tar.gz"
          done

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Sign
        working-directory: apps/foreman_agent
        # bash, not the default shell, so a failed sign isn't hidden by the pipe.
        shell: bash
        env:
          FOREMAN_RELEASE_PRIVATE_KEY: ${{ secrets.FOREMAN_RELEASE_PRIVATE_KEY }}
        run: |
          mix deps.get
          # Compile first so the task's output is only the signature.
          mix compile
          for arch in amd64 arm64; do
            tarball="../../out/foreman_agent-$VERSION-linux-$arch.tar.gz"
            mix foreman_agent.sign "$VERSION" "linux-$arch" "$tarball" | tail -n 1 > "$tarball.sig"
            [ -s "$tarball.sig" ]
          done

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Agent $VERSION" \
            --notes "Register on the control plane host with: scripts/publish-agent-release.sh $VERSION" \
            out/*.tar.gz out/*.sig
