services:
  app:
    image: mcr.microsoft.com/devcontainers/base:debian
    command: sleep infinity
    stop_grace_period: 1s
    volumes:
      - ../..:/workspaces:cached
    ports:
      - "14000:4000"
  sidecar:
    image: alpine:3.22
    command: ["sh", "-c", "echo sidecar token=$$SIDECAR_TOKEN; exec sleep 1000000"]
    stop_grace_period: 1s
    environment:
      SIDECAR_TOKEN: ${SIDECAR_TOKEN:-unset}
    ports:
      - "16379:6379"
