openapi: 3.1.1
info:
  title: Foreman public API
  version: 1.0.0
  description: Version 1 of the Foreman environment API. Connect to the authorization server at the instance origin, then use the bearer token under /api/v1.
servers:
  - url: /
# Token exchange and revocation accept public clients or installation Basic auth.
security: [{}, {serviceCredential: []}]
paths:
  /.well-known/oauth-authorization-server:
    get:
      security: []
      operationId: getOAuthMetadata
      summary: Discover the instance issuer, endpoints, grants and scopes
      responses:
        '200':
          description: RFC 8414 metadata for this HTTPS issuer
          content:
            application/json:
              schema:
                type: object
                required: [issuer, device_authorization_endpoint, token_endpoint, revocation_endpoint, scopes_supported, grant_types_supported, response_types_supported, token_endpoint_auth_methods_supported]
                properties:
                  issuer: {type: string, format: uri}
                  device_authorization_endpoint: {type: string, format: uri}
                  token_endpoint: {type: string, format: uri}
                  revocation_endpoint: {type: string, format: uri}
                  scopes_supported: {type: array, items: {type: string}}
                  grant_types_supported: {type: array, items: {type: string}, example: ['urn:ietf:params:oauth:grant-type:device_code', refresh_token, client_credentials]}
                  response_types_supported: {type: array, items: {type: string}, example: []}
                  token_endpoint_auth_methods_supported: {type: array, items: {type: string}, example: [none, client_secret_basic]}
                  revocation_endpoint_auth_methods_supported: {type: array, items: {type: string}, example: [none, client_secret_basic]}
  /oauth/device/code:
    post:
      security: []
      operationId: requestDeviceCode
      summary: Begin personal approval on another device
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, scope]
              properties:
                client_id: {type: string}
                scope: {$ref: '#/components/schemas/ScopeString'}
      responses:
        '200':
          description: Single-use device code and browser approval instructions
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, expires_in, interval]
                properties:
                  device_code: {type: string}
                  user_code: {type: string}
                  verification_uri: {type: string, format: uri}
                  verification_uri_complete: {type: string, format: uri}
                  expires_in: {type: integer, example: 600}
                  interval: {type: integer, minimum: 1, description: Minimum seconds between polls}
        default: {$ref: '#/components/responses/OAuthError'}
  /oauth/token:
    post:
      operationId: obtainToken
      summary: Exchange a device code, rotate a refresh token, or obtain a service token
      description: Public clients supply client_id. Service installations use HTTP Basic client authentication. Successful responses use Cache-Control no-store and Pragma no-cache.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DeviceCodeGrant'
                - $ref: '#/components/schemas/RefreshTokenGrant'
                - $ref: '#/components/schemas/ClientCredentialsGrant'
      responses:
        '200':
          description: Personal grants include a new refresh token on each successful exchange. Service grants issue access tokens only.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, scope]
                properties:
                  access_token: {type: string}
                  token_type: {const: Bearer}
                  expires_in: {type: integer, example: 900}
                  scope: {$ref: '#/components/schemas/ScopeString'}
                  refresh_token: {type: string}
        default: {$ref: '#/components/responses/OAuthError'}
  /oauth/revoke:
    post:
      operationId: revokeToken
      summary: Revoke the personal connection on logout or invalidate a service access token
      description: For a personal connection, revoke the refresh token and its associated access tokens. Public clients supply client_id. Service installations authenticate with HTTP Basic.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
                token_type_hint: {type: string, enum: [access_token, refresh_token]}
                client_id: {type: string}
      responses:
        '200': {description: 'Revocation processed, including an already invalid token'}
        default: {$ref: '#/components/responses/OAuthError'}
  /api/v1/me:
    get:
      operationId: getIdentity
      summary: Show the acting identity and connected client
      security: [{foremanToken: []}]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/repos:
    get:
      operationId: listRepos
      x-required-permission: 'repos:list'
      summary: List repositories available to this connection
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepositoryPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/boxes:
    get:
      operationId: listBoxes
      x-required-permission: 'boxes:list'
      summary: List boxes available to this connection
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoxPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/environments:
    get:
      operationId: listEnvironments
      x-required-permission: 'environments:list'
      summary: List visible environments
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createEnvironment
      x-required-permission: 'environments:create plus the expiry action scope when supplied'
      summary: Reserve an environment and queue provisioning
      description: With box_id omitted, prefer a provisionable box owned by the acting user, then any other provisionable box the connection may use. Service accounts select only from their granted boxes. If none qualifies, return 409 with code no_provisionable_boxes.
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Key'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Create'}
      responses:
        '202':
          description: Accepted operation or replay of the original submission. The Location identifies the original operation even after its history expires.
          headers:
            Location:
              required: true
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Accepted'}
        '409':
          description: Automatic placement found no provisionable box, an explicit box raised a capacity conflict, or the request key conflicts with a prior submission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                noProvisionableBoxes:
                  value: {code: no_provisionable_boxes, message: You have no provisionable boxes.}
        '410':
          description: The original environment for this accepted create key has been destroyed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: original_environment_gone, message: Original environment gone.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/environments/{id}:
    get:
      operationId: getEnvironment
      x-required-permission: 'environments:read'
      summary: Read current environment state and connection details
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Environment'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/environments/{id}/operations:
    get:
      operationId: listEnvironmentOperations
      x-required-permission: 'operations:list'
      summary: Read authorized operation history through its retention period, including after destroy
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: History remains available for 90 days after each operation finishes, including after environment destruction.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: operateEnvironment
      x-required-permission: 'environments:start, environments:stop, or environments:destroy according to the requested action. A restart needs both environments:stop and environments:start.'
      summary: Queue a lifecycle action
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Key'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Action'}
      responses:
        '200':
          description: Environment is already in the requested stable state
          content:
            application/json:
              schema:
                type: object
                required: [environment_id]
                properties:
                  environment_id: {$ref: '#/components/schemas/Id'}
        '202':
          description: New operation or existing operation moving toward the requested state
          headers:
            Location:
              required: true
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Accepted'}
        default: {$ref: '#/components/responses/Error'}
        '409':
          description: The action conflicts with the current transition or due expiry, or the request key conflicts with an earlier submission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: lifecycle_conflict, message: An opposing lifecycle action is in progress.}
  /api/v1/operations/{id}:
    get:
      operationId: getOperation
      x-required-permission: 'operations:read'
      summary: Read a lifecycle operation and its outcome
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/operations/{id}/logs:
    get:
      operationId: getOperationLogs
      x-required-permission: 'logs:read'
      summary: Read the next portion of the operation log
      description: Logs remain available for 30 days after operation completion, including after environment destruction.
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{scope}/{subject}:
    get:
      operationId: listSecrets
      x-required-permission: 'secrets:list'
      summary: List the names of the secrets set at one scope
      description: Personal connections only. Values are never returned. Repository and owner secrets take an admin.
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/SecretScope'}
        - {$ref: '#/components/parameters/SecretSubject'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretPage'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: changeSecrets
      x-required-permission: 'secrets:write'
      summary: Set and remove secrets at one scope together
      description: Every change in the request is saved, or none is. Repeating a request leaves the same secrets in place. Running environments the scope reaches keep their current values until they restart.
      security: [{foremanToken: []}]
      parameters:
        - {$ref: '#/components/parameters/SecretScope'}
        - {$ref: '#/components/parameters/SecretSubject'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SecretChanges'}
      responses:
        '200':
          description: The names changed and the running environments the scope reaches
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretChangeResult'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    serviceCredential:
      type: http
      scheme: basic
      description: Installation client ID and rotatable secret sent using HTTP Basic over HTTPS (client_secret_basic)
    foremanToken:
      type: http
      scheme: bearer
      description: Access token issued by this Foreman instance for the connected user or service account.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      description: Opaque position issued for this grant and collection. Omit on the first request.
      name: cursor
      in: query
      schema: {type: string}
    SecretScope:
      name: scope
      in: path
      required: true
      description: Which level the secrets belong to. Later levels override earlier ones in an environment.
      schema: {type: string, enum: [owner, repo, user, environment]}
    SecretSubject:
      name: subject
      in: path
      required: true
      description: The environment or repository ID, the owner's ID or login, or `me` for the connected user.
      schema: {type: string}
    Key:
      name: Idempotency-Key
      in: header
      required: true
      description: Supply the same nonblank value when retrying the same request.
      schema: {type: string, minLength: 1, pattern: '\S'}
  responses:
    Error:
      description: Request failed. See the stable code for recovery.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    OAuthError:
      description: OAuth error. Device polling can return authorization_pending, slow_down, access_denied or expired_token. Invalid or expired refresh grants return invalid_grant.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              error_description: {type: string}
  schemas:
    DeviceCodeGrant:
      type: object
      required: [grant_type, client_id, device_code]
      properties:
        grant_type: {type: string, const: 'urn:ietf:params:oauth:grant-type:device_code'}
        client_id: {type: string}
        device_code: {type: string}
      not: {required: [client_secret]}
    RefreshTokenGrant:
      type: object
      required: [grant_type, client_id, refresh_token]
      properties:
        grant_type: {type: string, const: refresh_token}
        client_id: {type: string}
        refresh_token: {type: string}
        scope: {$ref: '#/components/schemas/ScopeString'}
      not: {required: [client_secret]}
    ClientCredentialsGrant:
      type: object
      description: Send the installation ID and secret in the HTTP Basic Authorization header.
      required: [grant_type]
      properties:
        grant_type: {type: string, const: client_credentials}
        scope: {$ref: '#/components/schemas/ScopeString'}
      not:
        anyOf:
          - required: [client_id]
          - required: [client_secret]
    ScopeString:
      type: string
      description: Space-separated resource-first scope names from scopes_supported
      example: 'environments:create operations:read'
    Id: {type: string, format: uuid}
    Identity:
      type: object
      required: [id, kind, client_id]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        kind: {type: string, enum: [user, service_account]}
        client_id: {type: string}
        name: {type: string, description: "A user's GitHub login, or the name an administrator gave a service account."}
    Repository:
      type: object
      required: [id, full_name, default_branch]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        full_name: {type: string}
        default_branch: {type: string}
    Box:
      type: object
      required: [id, name, online]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        online: {type: boolean}
    Expiry:
      type: object
      additionalProperties: false
      required: [at, action]
      properties:
        at: {type: string, format: date-time}
        action: {type: string, enum: [stop, destroy]}
    Create:
      type: object
      additionalProperties: false
      required: [repo_id]
      properties:
        repo_id: {$ref: '#/components/schemas/Id'}
        box_id:
          $ref: '#/components/schemas/Id'
          description: Pins provisioning to this box. Omit to enable automatic placement.
        branch:
          type: string
          description: Named Git branch of at most 255 UTF-8 bytes. Omit to use the repository default branch.
          minLength: 1
          maxLength: 255
          # Reject invalid components, ref sequences and characters as in ForemanProtocol.Schema.
          not:
            pattern: '(^[-/.]|^@$|[/.]$|\.lock(/|$)|/\.|\.\.|//|@\{|[\u0000-\u0020\u007f~^:?*\[\\])'
        expiry: {$ref: '#/components/schemas/Expiry'}
        confirm_capacity_warning: {type: boolean, default: false}
    Action:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [start, stop, destroy, restart_affected, restart_all], description: 'restart_affected recreates the services whose compose configuration uses a secret that changed since they last came up, and always restarts the workspace container. restart_all stops and starts every container without recreating any, so processes start again and read the current secrets file. Both need a running environment.'}
        confirm_capacity_warning: {type: boolean, default: false}
    Accepted:
      type: object
      required: [environment_id, operation_id]
      properties:
        environment_id: {$ref: '#/components/schemas/Id'}
        operation_id: {$ref: '#/components/schemas/Id'}
        operation_history_expired:
          type: boolean
          description: Present and true on replay when the original operation has passed its retention window. Use the environment ID to read its current state.
    Environment:
      type: object
      required: [id, slug, repo_id, branch, box_id, desired_state, observed_state, readiness]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        slug: {type: string}
        repo_id: {$ref: '#/components/schemas/Id'}
        branch: {type: string}
        box_id: {$ref: '#/components/schemas/Id'}
        desired_state: {type: string}
        observed_state: {type: string}
        readiness: {type: string, enum: [ready, not_ready, unknown]}
        created_at: {type: string, format: date-time}
        expiry: {$ref: '#/components/schemas/Expiry'}
        hostname: {type: string}
        ssh_user: {type: string}
        workspace_folder: {type: string}
    Operation:
      type: object
      required: [id, environment_id, action, trigger, status]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        environment_id: {$ref: '#/components/schemas/Id'}
        action: {type: string, description: Lifecycle action reported by the operation.}
        trigger: {type: string, description: What initiated the operation., examples: [request, expiry]}
        status: {type: string, enum: [queued, dispatched, running, succeeded, failed, cancelled]}
        error: {$ref: '#/components/schemas/Error'}
    OperationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Operation'}
        next_cursor: {type: [string, 'null']}
    LogPage:
      type: object
      required: [text, next_cursor, truncated]
      properties:
        text: {type: string}
        next_cursor: {type: string, description: Position after the returned text. Use it to continue polling.}
        truncated: {type: boolean}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    Secret:
      type: object
      required: [name, updated_at]
      properties:
        name: {type: string}
        updated_at: {type: string, format: date-time}
    SecretPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Secret'}
        next_cursor: {type: [string, 'null']}
    SecretValue:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: {type: string, description: An environment variable name. The FOREMAN_ prefix is reserved.}
        value: {type: string, description: Up to 64 KiB, without NUL bytes.}
    SecretChanges:
      type: object
      additionalProperties: false
      description: At least one change and at most 100, with each name appearing once.
      properties:
        secrets:
          type: array
          items: {$ref: '#/components/schemas/SecretValue'}
        unset:
          type: array
          description: Names to remove. One that isn't set is skipped.
          items: {type: string}
    EnvironmentRef:
      type: object
      required: [id, slug]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        slug: {type: string}
    SecretChangeResult:
      type: object
      required: [set, unset, affected, others_affected]
      properties:
        set:
          type: array
          items: {type: string}
        unset:
          type: array
          description: The names that were set and are now removed.
          items: {type: string}
        affected:
          type: array
          description: The caller's running environments the scope reaches, for a connection that may list environments, and empty otherwise. Their running services keep the values they started with until restarted. The list does not depend on the values sent.
          items: {$ref: '#/components/schemas/EnvironmentRef'}
        others_affected:
          type: integer
          description: How many of other people's running environments the scope reaches.
    EnvironmentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Environment'}
        next_cursor: {type: [string, 'null']}
    RepositoryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Repository'}
        next_cursor: {type: [string, 'null']}
    BoxPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Box'}
        next_cursor: {type: [string, 'null']}
