# A control plane (the release image), a git server for the fixture repo,
# and a Linux box running the agent with its own Docker daemon. Driven by
# e2e/linux/run.sh.
name: foreman-e2e

services:
  cp:
    image: foreman-cp:e2e
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FOREMAN_ENCRYPTION_KEY: ${FOREMAN_ENCRYPTION_KEY}
      FOREMAN_AGENT_RELEASE_PUBLIC_KEY: ${FOREMAN_RELEASE_PUBLIC_KEY}
      PHX_HOST: cp
      PORT: "4000"
      FOREMAN_LISTEN_IP: 0.0.0.0
      FOREMAN_BASE_URL: http://cp:4000
      FOREMAN_FORCE_SSL: "false"
      FOREMAN_SECURE_COOKIES: "false"
      FOREMAN_GIT_BASE_URL: http://git:8080
      FOREMAN_AGENT_RELEASE_DIR: /var/lib/foreman/releases
    volumes:
      - cp-data:/var/lib/foreman
      - ../:/e2e:ro

  git:
    image: busybox:1.37
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/srv"]
    volumes:
      - ../../tmp/e2e-linux/git:/srv:ro

  box:
    image: foreman-box:e2e
    privileged: true
    depends_on: [cp, git]
    # Like a real box, /run is a tmpfs: secrets don't survive a restart.
    tmpfs: [/run]
    environment:
      FOREMAN_URL: http://cp:4000
      FOREMAN_JOIN_TOKEN: ${FOREMAN_JOIN_TOKEN:-}
      FOREMAN_ALLOWED_GIT_HOSTS: git
      FOREMAN_INSECURE_GIT_HOSTS: git
    volumes:
      - box-docker:/var/lib/docker
    profiles: [box]

volumes:
  cp-data:
  box-docker:
